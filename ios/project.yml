# XcodeGen spec: `scripts/generate.sh` (or `nix shell nixpkgs#xcodegen -c xcodegen`) writes Tau.xcodeproj.
name: Tau
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# The bundle ID and the signing team: Config/Tau.xcconfig, and yours in Config/Local.xcconfig.
configFiles:
  Debug: Config/Tau.xcconfig
  Release: Config/Tau.xcconfig
packages:
  TelegramFoundation:
    path: ThirdParty/Telegram
  # LaTeX in answers: iosMath's typesetter in Swift, with its math fonts (MIT).
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
targets:
  Tau:
    type: application
    platform: iOS
    sources:
      - path: Tau
      - path: ThirdParty/Telegram/Images.xcassets
      - path: ThirdParty/Telegram/LegacyImages.xcassets
      - path: ThirdParty/Telegram/Animations
        buildPhase: resources
      - path: ThirdParty/Telegram/Resources
        buildPhase: resources
      - path: ThirdParty/tdesktop/background.tgv
        buildPhase: resources
    dependencies:
      - target: TauWidgets
      - target: TauShare
      - target: TauNotifications
      - package: SwiftMath
      - package: TelegramFoundation
        products:
          - SwiftSignalKit
          - AsyncDisplayKit
          - Display
          - ComponentFlow
          - MergeLists
          - GradientBackground
          - NavigationBarImpl
          - GlassBackgroundComponent
          - StreamingTextReveal
          - ActivityIndicator
          - UIKitRuntimeUtils
          - ComponentDisplayAdapters
          - InteractiveTextComponent
          - TabBarComponent
          - EdgeEffect
          - TelegramPresentationData
          - LottieComponent
          - LottieSettings
          - TelegramCore
          - TelegramUIPreferences
          - ContextUI
          - ContextControllerImpl
          - CheckNode
          - ChatMessageSelectionNode
          - AccountContext
          - LegacyComponents
          - Svg
          - AnimatedTextComponent
          - ChatTitleActivityNode
          - AnimatedCountLabelNode
          - AttachmentUI
          - MediaPickerUI
          - SSignalKit
          - ChatPresentationInterfaceState
          - GalleryUI
          - ContextMenuScreen
          - TextSelectionNode
          - SearchUI
          - SearchBarNode
          - SegmentedControlNode
          - HorizontalTabsComponent
          - MosaicLayout
          - AudioBlob
          - HeaderPanelContainerComponent
          - ChatListTitleView
          - UndoUI
          - AlertComponent
          - AlertInputFieldComponent
          - libprisma
          - ItemListUI
          - SemanticStatusNode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAU_BUNDLE_ID)
        PRODUCT_NAME: Tau
        # The keychain group the share extension reads the chats from and leaves what it could not send in.
        CODE_SIGN_ENTITLEMENTS: Tau/Tau.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Tau/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: tau
        # Only TLS, which is exempt: no export compliance question for each upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Send photos to the agent."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to send to the agent."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dictate messages to the agent."
        # Telegram's camera code (LegacyComponents' PGCameraDeviceAngleSampler) uses Core Motion, which needs a purpose
        # string to upload.
        INFOPLIST_KEY_NSMotionUsageDescription: "Keep the photos you take upright."
        # The Live Activity (TauWidgets, docs/live-activity.md).
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
  TauWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TauWidgets
      - path: Tau/LiveActivity/TauActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAU_BUNDLE_ID).widgets
        PRODUCT_NAME: TauWidgets
        INFOPLIST_FILE: TauWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  TauShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TauShare
      - path: Tau/Share/ShareModels.swift
      - path: Tau/Share/ImageEncoding.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAU_BUNDLE_ID).share
        PRODUCT_NAME: TauShare
        INFOPLIST_FILE: TauShare/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TauShare/TauShare.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  # Shows each push as its chat's message, with the chat's avatar (docs/notifications.md).
  TauNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: TauNotifications
      - path: Tau/Share/ShareModels.swift
      - path: Tau/Common/LetterAvatar.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAU_BUNDLE_ID).notifications
        PRODUCT_NAME: TauNotifications
        INFOPLIST_FILE: TauNotifications/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TauNotifications/TauNotifications.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  TauUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TauUITests
    dependencies:
      - target: Tau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAU_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tau
        SWIFT_VERSION: "5.0"
schemes:
  Tau:
    build:
      targets:
        Tau: all
        TauUITests: [test]
    test:
      targets:
        - TauUITests
