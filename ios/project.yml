# XcodeGen spec: `scripts/generate.sh` (or `nix shell nixpkgs#xcodegen -c xcodegen`) writes Tau.xcodeproj.
name: Tau
options:
  bundleIdPrefix: com.rumisle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TelegramFoundation:
    path: ThirdParty/Telegram
targets:
  Tau:
    type: application
    platform: iOS
    sources:
      - path: Tau
      - path: ThirdParty/Telegram/Images.xcassets
      - path: ThirdParty/Telegram/Animations
        buildPhase: resources
      - path: ThirdParty/Telegram/Resources
        buildPhase: resources
      - path: ThirdParty/tdesktop/background.tgv
        buildPhase: resources
    dependencies:
      - package: TelegramFoundation
        products:
          - SwiftSignalKit
          - AsyncDisplayKit
          - Display
          - ComponentFlow
          - MergeLists
          - GradientBackground
          - NavigationBarImpl
          - GlassBackgroundComponent
          - StreamingTextReveal
          - ActivityIndicator
          - UIKitRuntimeUtils
          - ComponentDisplayAdapters
          - InteractiveTextComponent
          - TabBarComponent
          - EdgeEffect
          - TelegramPresentationData
          - LottieComponent
          - LottieSettings
          - TelegramCore
          - TelegramUIPreferences
          - ContextUI
          - ContextControllerImpl
          - CheckNode
          - ChatMessageSelectionNode
          - AccountContext
          - LegacyComponents
          - Svg
          - AnimatedTextComponent
          - ChatTitleActivityNode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rumisle.tau
        PRODUCT_NAME: Tau
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: tau
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Send photos to the agent."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to send to the agent."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Dictate messages to the agent."
  TauUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TauUITests
    dependencies:
      - target: Tau
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rumisle.tau.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tau
        SWIFT_VERSION: "5.0"
schemes:
  Tau:
    build:
      targets:
        Tau: all
        TauUITests: [test]
    test:
      targets:
        - TauUITests
